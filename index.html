<!DOCTYPE html>
<html lang="zh-TW">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>AI藥品拍照辨識</title>


<!-- =======================
     ONNX Runtime Web
======================= -->

<script
    src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js">
</script>


<style>

/* =======================
   整體
======================= */

body{

    margin:0;

    background:#000;

    color:white;

    text-align:center;

    font-family:sans-serif;

}


/* =======================
   相機區域
   1:1
======================= */

#cameraBox{

    position:relative;

    width:100vw;

    aspect-ratio:1 / 1;

    overflow:hidden;

    background:black;

}


/* =======================
   Video / Canvas
======================= */

video,
canvas{

    position:absolute;

    left:0;

    top:0;

    width:100%;

    height:100%;

}


/*
    相機畫面填滿 1:1 框

    超出的左右或上下部分會被裁掉
*/

video{

    object-fit:cover;

}


/*
    Canvas 也維持 1:1 顯示
*/

canvas{

    object-fit:contain;

}


/* =======================
   藥品數量
======================= */

#count{

    font-size:26px;

    margin:15px;

}


/* =======================
   一般按鈕
======================= */

button{

    margin:8px;

    padding:12px 25px;

    font-size:18px;

    cursor:pointer;

}


/* =======================
   顏色選擇區
======================= */

.colorSelect{

    margin:15px;

}


.colorTitle{

    font-size:20px;

    margin-bottom:8px;

}


/* =======================
   顏色按鈕
======================= */

.colorBtn{

    width:60px;

    height:45px;

    margin:5px;

    padding:0;

    border:3px solid white;

    border-radius:8px;

    cursor:pointer;

}


/* 紅色 */

.colorBtn.red{

    background:#ff0000;

}


/* 綠色 */

.colorBtn.green{

    background:#00cc00;

}


/* 黃色 */

.colorBtn.yellow{

    background:#ffff00;

}


/* =======================
   目前選擇的顏色
======================= */

.colorBtn.selected{

    border:5px solid #00ffff;

    box-shadow:
        0 0 10px #00ffff;

}


</style>

</head>


<body>


<!-- =======================
     相機
======================= -->

<div id="cameraBox">

    <video
        id="video"
        autoplay
        playsinline>
    </video>


    <canvas id="canvas">
    </canvas>

</div>


<!-- =======================
     藥品數量
======================= -->

<div id="count">

    藥品數量:0 顆

</div>


<!-- =======================
     顏色選擇
======================= -->

<div class="colorSelect">

    <div class="colorTitle">

        標記顏色

    </div>


    <!-- 紅色 -->

    <button
        class="colorBtn red selected"
        onclick="selectColor('red', this)"
        title="紅色">
    </button>


    <!-- 綠色 -->

    <button
        class="colorBtn green"
        onclick="selectColor('#00cc00', this)"
        title="綠色">
    </button>


    <!-- 黃色 -->

    <button
        class="colorBtn yellow"
        onclick="selectColor('#ffff00', this)"
        title="黃色">
    </button>

</div>


<!-- =======================
     操作按鈕
======================= -->

<button onclick="startCamera()">

    開啟相機

</button>


<button onclick="capture()">

    拍照辨識

</button>


<button onclick="resetCamera()">

    重新拍攝

</button>



<script>


/* =======================
   ONNX Runtime
======================= */

ort.env.wasm.wasmPaths =
"https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/";



/* =======================
   全域變數
======================= */

let session = null;

let stream = null;

let locked = false;


/*
    使用者目前選擇的顏色

    預設紅色
*/

let selectedColor = "red";


/*
    儲存 AI 辨識結果

    換顏色時不需要重新 AI
*/

let detectedPoints = [];


/*
    儲存拍照後的乾淨 1:1 照片

    換顏色時會重新使用這張照片
*/

let originalPhoto = null;



/* =======================
   DOM
======================= */

const video =
document.getElementById("video");


const canvas =
document.getElementById("canvas");


const ctx =
canvas.getContext("2d");



/* =======================
   選擇顏色
======================= */

function selectColor(color, button){


    /*
        設定目前顏色
    */

    selectedColor = color;



    /*
        移除其他按鈕的 selected
    */

    document
        .querySelectorAll(".colorBtn")
        .forEach(btn => {

            btn.classList.remove("selected");

        });



    /*
        標記目前選擇
    */

    button.classList.add("selected");



    /*
        如果已經有 AI 辨識結果

        直接重新繪製

        不重新執行 AI
    */

    if(
        detectedPoints.length > 0 &&
        originalPhoto
    ){

        drawPoints();

    }

}



/* =======================
   載入模型
======================= */

async function loadModel(){


    session =
    await ort.InferenceSession.create(

        "model.onnx",

        {

            executionProviders:[
                "wasm"
            ]

        }

    );

}



/* =======================
   開啟相機
======================= */

async function startCamera(){

    try{


        /*
            載入 AI 模型
        */

        if(!session){

            await loadModel();

        }



        /*
            開啟後置相機
        */

        stream =
        await navigator.mediaDevices.getUserMedia({

            video:{

                facingMode:{

                    ideal:
                    "environment"

                },


                width:{

                    ideal:1280

                },


                height:{

                    ideal:720

                }

            },


            audio:false

        });



        /*
            放入 Video
        */

        video.srcObject =
        stream;



    }
    catch(error){

        console.error(error);


        alert(
            "無法開啟相機，請確認瀏覽器已允許相機權限。"
        );

    }

}



/* =======================
   拍照
   實際照片為 1:1
======================= */

async function capture(){


    /*
        防止重複拍照
    */

    if(locked){

        return;

    }



    /*
        確認相機
    */

    if(
        !video.videoWidth ||
        !video.videoHeight
    ){

        alert(
            "請先開啟相機。"
        );

        return;

    }



    locked = true;



    /*
        =================================
        取得中央正方形
        =================================

        例如：

        相機：
        1280 × 720

        實際拍照：
        720 × 720
    */

    const size =
    Math.min(

        video.videoWidth,

        video.videoHeight

    );



    /*
        原始影像中央 X
    */

    const sx =
    (video.videoWidth - size) / 2;



    /*
        原始影像中央 Y
    */

    const sy =
    (video.videoHeight - size) / 2;



    /*
        =================================
        建立 1:1 原始照片
        =================================
    */

    originalPhoto =
    document.createElement("canvas");


    originalPhoto.width =
    size;


    originalPhoto.height =
    size;



    const photoCtx =
    originalPhoto.getContext("2d");



    /*
        從相機中央裁切成正方形
    */

    photoCtx.drawImage(

        video,

        sx,
        sy,

        size,
        size,

        0,
        0,
        size,
        size

    );



    /*
        =================================
        Canvas 也設定成 1:1
        =================================
    */

    canvas.width =
    size;


    canvas.height =
    size;



    /*
        顯示乾淨照片
    */

    ctx.drawImage(

        originalPhoto,

        0,
        0

    );



    /*
        =================================
        AI 辨識
        =================================
    */

    try{

        await detect();

    }
    catch(error){

        console.error(error);


        alert(
            "AI 辨識失敗，請重新拍攝。"
        );


        locked = false;

    }

}



/* =======================
   重新拍攝
======================= */

function resetCamera(){


    /*
        解鎖
    */

    locked = false;



    /*
        清除辨識結果
    */

    detectedPoints = [];



    /*
        清除原始照片
    */

    originalPhoto = null;



    /*
        清除 Canvas
    */

    ctx.clearRect(

        0,

        0,

        canvas.width,

        canvas.height

    );



    /*
        重設數量
    */

    document.getElementById("count")
    .innerHTML =
    "藥品數量:0 顆";

}



/* =======================
   AI 辨識
======================= */

async function detect(){


    /*
        直接使用
        拍照後的 1:1 照片
    */

    let result =
    await runAI(originalPhoto);



    /*
        顯示辨識結果
    */

    drawResult(result);

}



/* =======================
   ONNX
======================= */

async function runAI(img){


    /*
        AI 輸入尺寸

        640 × 640

        因為 img 本身已經是 1:1，
        所以這裡不會再產生長方形 padding。
    */

    const size = 640;



    /*
        建立 640 × 640 Canvas
    */

    let c =
    document.createElement("canvas");


    c.width =
    size;


    c.height =
    size;



    let cctx =
    c.getContext("2d");



    /*
        =================================
        1:1 → 640 × 640
        =================================

        因為照片本身就是正方形，

        所以直接縮放即可。

        scale = 640 / 原始尺寸

        padX = 0
        padY = 0
    */

    let scale =
    size / img.width;



    let w =
    size;


    let h =
    size;



    let padX =
    0;


    let padY =
    0;



    /*
        黑色背景
    */

    cctx.fillStyle =
    "black";


    cctx.fillRect(

        0,

        0,

        size,

        size

    );



    /*
        將 1:1 照片縮放到
        640 × 640
    */

    cctx.drawImage(

        img,

        0,
        0,

        w,
        h

    );



    /*
        取得像素
    */

    let pix =
    cctx.getImageData(

        0,

        0,

        size,

        size

    );



    /*
        RGB Float32Array
    */

    let input =
    new Float32Array(

        size *
        size *
        3

    );



    /*
        RGB

        R
        G
        B
    */

    for(
        let i = 0;
        i < size * size;
        i++
    ){


        input[i] =
        pix.data[i * 4] / 255;



        input[
            i + size * size
        ] =
        pix.data[i * 4 + 1] / 255;



        input[
            i + size * size * 2
        ] =
        pix.data[i * 4 + 2] / 255;

    }



    /*
        建立 Tensor
    */

    let tensor =
    new ort.Tensor(

        "float32",

        input,

        [

            1,

            3,

            640,

            640

        ]

    );



    /*
        執行 ONNX
    */

    let output =
    await session.run({

        [session.inputNames[0]]:
        tensor

    });



    /*
        回傳

        因為現在是 1:1，

        scale 只需要負責
        640 → 原始照片尺寸
    */

    return {

        output:
        output.output0,

        scale,

        padX,

        padY

    };

}



/* =======================
   處理辨識結果
======================= */

function drawResult(r){


    let data =
    r.output.data;



    /*
        YOLO 8400 個候選
    */

    let total =
    8400;



    let points = [];



    /*
        找出信心度 >= 0.65
    */

    for(
        let i = 0;
        i < total;
        i++
    ){


        let score =
        data[
            i + total * 4
        ];



        if(score < 0.65){

            continue;

        }



        /*
            將 640 × 640 座標
            轉回實際照片座標
        */

        points.push({

            x:
            (
                data[i]
                -
                r.padX
            )
            /
            r.scale,


            y:
            (
                data[
                    i + total
                ]
                -
                r.padY
            )
            /
            r.scale,


            w:
            data[
                i + total * 2
            ]
            /
            r.scale,


            h:
            data[
                i + total * 3
            ]
            /
            r.scale,


            score

        });

    }



    /*
        NMS
    */

    points =
    nms(

        points,

        0.35

    );



    /*
        =================================
        儲存 AI 辨識結果
        =================================

        這裡只儲存座標。

        之後使用者切換顏色，
        不需要重新執行 AI。
    */

    detectedPoints =
    points;



    /*
        畫出標記
    */

    drawPoints();



    /*
        顯示數量
    */

    document.getElementById("count")
    .innerHTML =

    "藥品數量:"
    +
    points.length
    +
    " 顆";

}



/* =======================
   畫出標記
======================= */

function drawPoints(){


    /*
        如果沒有照片
        不執行
    */

    if(!originalPhoto){

        return;

    }



    /*
        =================================
        第一步
        清除 Canvas
        =================================
    */

    ctx.clearRect(

        0,

        0,

        canvas.width,

        canvas.height

    );



    /*
        =================================
        第二步
        放回乾淨的 1:1 照片
        =================================
    */

    ctx.drawImage(

        originalPhoto,

        0,

        0,

        canvas.width,

        canvas.height

    );



    /*
        =================================
        第三步
        畫出所有藥品標記
        =================================
    */

    detectedPoints.forEach(p=>{


        ctx.beginPath();


        /*
            藥品中心點
        */

        ctx.arc(

            p.x,

            p.y,

            8,

            0,

            Math.PI * 2

        );


        /*
            使用者目前選擇的顏色
        */

        ctx.fillStyle =
        selectedColor;


        ctx.fill();


    });

}



/* =======================
   NMS
======================= */

function nms(boxes, t){


    /*
        信心度由高到低
    */

    boxes.sort(

        (a,b)=>
        b.score - a.score

    );


    let result = [];



    while(
        boxes.length
    ){


        /*
            取最高分
        */

        let best =
        boxes.shift();


        result.push(best);



        /*
            移除重疊過高的結果
        */

        boxes =
        boxes.filter(

            b =>
            iou(best,b) < t

        );

    }



    return result;

}



/* =======================
   IOU
======================= */

function iou(a,b){


    /*
        A 左上
    */

    let ax1 =
    a.x - a.w / 2;


    let ay1 =
    a.y - a.h / 2;



    /*
        A 右下
    */

    let ax2 =
    a.x + a.w / 2;


    let ay2 =
    a.y + a.h / 2;



    /*
        B 左上
    */

    let bx1 =
    b.x - b.w / 2;


    let by1 =
    b.y - b.h / 2;



    /*
        B 右下
    */

    let bx2 =
    b.x + b.w / 2;


    let by2 =
    b.y + b.h / 2;



    /*
        交集寬度
    */

    let iw =
    Math.max(

        0,

        Math.min(
            ax2,
            bx2
        )
        -
        Math.max(
            ax1,
            bx1
        )

    );



    /*
        交集高度
    */

    let ih =
    Math.max(

        0,

        Math.min(
            ay2,
            by2
        )
        -
        Math.max(
            ay1,
            by1
        )

    );



    /*
        交集面積
    */

    let inter =
    iw * ih;



    /*
        IOU
    */

    return inter /

    (

        a.w * a.h
        +
        b.w * b.h
        -
        inter

    );

}


</script>


</body>

</html>
