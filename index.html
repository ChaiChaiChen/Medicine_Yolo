<!DOCTYPE html>
<html lang="zh-TW">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>AI藥品拍照辨識</title>


<!-- ONNX Runtime Web -->

<script
    src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js">
</script>


<style>

/* =======================
   整體
======================= */

body{

    margin:0;

    background:#000;

    color:white;

    text-align:center;

    font-family:sans-serif;

}


/* =======================
   相機區域
======================= */

#cameraBox{

    position:relative;

    width:100vw;

    height:70vh;

    overflow:hidden;

    background:black;

}


video,
canvas{

    position:absolute;

    left:0;

    top:0;

    width:100%;

    height:100%;

}


video{

    object-fit:contain;

}


canvas{

    object-fit:contain;

}


/* =======================
   藥品數量
======================= */

#count{

    font-size:26px;

    margin:15px;

}


/* =======================
   一般按鈕
======================= */

button{

    margin:8px;

    padding:12px 25px;

    font-size:18px;

    cursor:pointer;

}


/* =======================
   顏色選擇區
======================= */

.colorSelect{

    margin:15px;

}


.colorTitle{

    font-size:20px;

    margin-bottom:8px;

}


/* =======================
   顏色按鈕
======================= */

.colorBtn{

    width:60px;

    height:45px;

    margin:5px;

    padding:0;

    border:3px solid white;

    border-radius:8px;

    cursor:pointer;

}


/* 紅色 */

.colorBtn.red{

    background:red;

}


/* 綠色 */

.colorBtn.green{

    background:green;

}


/* 黃色 */

.colorBtn.yellow{

    background:yellow;

}


/* =======================
   目前選擇的顏色
======================= */

.colorBtn.selected{

    border:5px solid #00ffff;

    box-shadow:
        0 0 10px #00ffff;

}


</style>

</head>


<body>


<!-- =======================
     相機
======================= -->

<div id="cameraBox">

    <video
        id="video"
        autoplay
        playsinline>
    </video>


    <canvas id="canvas">
    </canvas>

</div>


<!-- =======================
     藥品數量
======================= -->

<div id="count">

    藥品數量:0 顆

</div>


<!-- =======================
     顏色選擇
======================= -->

<div class="colorSelect">

    <div class="colorTitle">

        標記顏色

    </div>


    <!-- 紅色 -->

    <button
        class="colorBtn red selected"
        onclick="selectColor('red', this)"
        title="紅色">
    </button>


    <!-- 綠色 -->

    <button
        class="colorBtn green"
        onclick="selectColor('green', this)"
        title="綠色">
    </button>


    <!-- 黃色 -->

    <button
        class="colorBtn yellow"
        onclick="selectColor('yellow', this)"
        title="黃色">
    </button>

</div>


<!-- =======================
     操作按鈕
======================= -->

<button onclick="startCamera()">

    開啟相機

</button>


<button onclick="capture()">

    拍照辨識

</button>


<button onclick="resetCamera()">

    重新拍攝

</button>



<script>


/* =======================
   ONNX Runtime
======================= */

ort.env.wasm.wasmPaths =
"https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/";



/* =======================
   全域變數
======================= */

let session = null;

let stream = null;

let locked = false;


/*
    使用者目前選擇的顏色

    預設為紅色
*/

let selectedColor = "red";


/*
    儲存 AI 辨識結果

    這個陣列非常重要。

    使用者改變顏色時，
    不需要重新執行 AI，
    只需要重新畫這些點。
*/

let detectedPoints = [];



/* =======================
   DOM
======================= */

const video =
document.getElementById("video");


const canvas =
document.getElementById("canvas");


const ctx =
canvas.getContext("2d");



/* =======================
   使用者選擇顏色
======================= */

function selectColor(color, button){


    /*
        設定目前顏色
    */

    selectedColor = color;



    /*
        移除所有顏色按鈕的 selected
    */

    document
        .querySelectorAll(".colorBtn")
        .forEach(btn => {

            btn.classList.remove("selected");

        });



    /*
        將目前選擇的顏色加上 selected
    */

    button.classList.add("selected");



    /*
        如果已經完成 AI 辨識

        直接重新畫標記

        不重新執行 AI
    */

    if(detectedPoints.length > 0){

        drawPoints();

    }

}



/* =======================
   載入 AI 模型
======================= */

async function loadModel(){


    session =
    await ort.InferenceSession.create(

        "model.onnx",

        {

            executionProviders:[
                "wasm"
            ]

        }

    );

}



/* =======================
   開啟相機
======================= */

async function startCamera(){


    try{


        /*
            如果 AI 模型還沒載入
            先載入模型
        */

        if(!session){

            await loadModel();

        }



        /*
            開啟手機後置相機
        */

        stream =
        await navigator.mediaDevices.getUserMedia({

            video:{

                facingMode:{

                    ideal:
                    "environment"

                },


                width:{

                    ideal:1280

                },


                height:{

                    ideal:720

                }

            },


            audio:false

        });



        /*
            將相機串流放進 video
        */

        video.srcObject =
        stream;



        /*
            相機載入完成
        */

        video.onloadedmetadata = ()=>{

            resizeCanvas();

        };


    }
    catch(error){

        console.error(error);

        alert(
            "無法開啟相機，請確認瀏覽器已允許相機權限。"
        );

    }

}



/* =======================
   調整 Canvas
======================= */

function resizeCanvas(){


    if(
        video.videoWidth === 0 ||
        video.videoHeight === 0
    ){

        return;

    }


    canvas.width =
    video.videoWidth;


    canvas.height =
    video.videoHeight;

}



/* =======================
   拍照定格
======================= */

async function capture(){


    /*
        如果已經拍照鎖定
        不重複執行
    */

    if(locked){

        return;

    }



    /*
        確認相機已經開啟
    */

    if(
        !video.videoWidth ||
        !video.videoHeight
    ){

        alert(
            "請先開啟相機。"
        );

        return;

    }



    locked = true;



    /*
        確保 Canvas 尺寸正確
    */

    resizeCanvas();



    /*
        將目前相機畫面
        完整複製到 Canvas
    */

    ctx.drawImage(

        video,

        0,

        0,

        video.videoWidth,

        video.videoHeight,

        0,

        0,

        canvas.width,

        canvas.height

    );



    /*
        開始 AI 辨識
    */

    try{

        await detect();

    }
    catch(error){

        console.error(error);

        alert(
            "AI 辨識失敗，請重新拍攝。"
        );

        locked = false;

    }

}



/* =======================
   重新拍攝
======================= */

function resetCamera(){


    /*
        解除拍照鎖定
    */

    locked = false;



    /*
        清除 AI 辨識結果

        非常重要
    */

    detectedPoints = [];



    /*
        清除 Canvas
    */

    ctx.clearRect(

        0,

        0,

        canvas.width,

        canvas.height

    );



    /*
        重設數量
    */

    document.getElementById("count")
    .innerHTML =
    "藥品數量:0 顆";

}



/* =======================
   開始辨識
======================= */

async function detect(){


    /*
        建立一個暫存 Canvas
    */

    let img =
    document.createElement("canvas");


    img.width =
    canvas.width;


    img.height =
    canvas.height;



    let ictx =
    img.getContext("2d");



    /*
        複製拍照結果
    */

    ictx.drawImage(

        canvas,

        0,

        0

    );



    /*
        執行 AI
    */

    let result =
    await runAI(img);



    /*
        顯示辨識結果
    */

    drawResult(result);

}



/* =======================
   ONNX AI
======================= */

async function runAI(img){


    /*
        AI 輸入尺寸
    */

    const size = 640;



    /*
        建立 640x640 Canvas
    */

    let c =
    document.createElement("canvas");


    c.width =
    size;


    c.height =
    size;



    let cctx =
    c.getContext("2d");



    /*
        計算縮放比例

        保持原始影像比例
    */

    let scale =
    Math.min(

        size / img.width,

        size / img.height

    );



    /*
        縮放後尺寸
    */

    let w =
    img.width * scale;


    let h =
    img.height * scale;



    /*
        計算左右 padding
    */

    let padX =
    (size - w) / 2;



    /*
        計算上下 padding
    */

    let padY =
    (size - h) / 2;



    /*
        黑色背景
    */

    cctx.fillStyle =
    "black";


    cctx.fillRect(

        0,

        0,

        size,

        size

    );



    /*
        將照片放入 640x640
    */

    cctx.drawImage(

        img,

        padX,

        padY,

        w,

        h

    );



    /*
        取得影像像素
    */

    let pix =
    cctx.getImageData(

        0,

        0,

        size,

        size

    );



    /*
        建立 RGB Float32Array
    */

    let input =
    new Float32Array(

        size * size * 3

    );



    /*
        RGB 分離

        R
        G
        B
    */

    for(
        let i = 0;
        i < size * size;
        i++
    ){


        input[i] =
        pix.data[i * 4] / 255;



        input[i + size * size] =
        pix.data[i * 4 + 1] / 255;



        input[i + size * size * 2] =
        pix.data[i * 4 + 2] / 255;

    }



    /*
        建立 ONNX Tensor
    */

    let tensor =
    new ort.Tensor(

        "float32",

        input,

        [

            1,

            3,

            640,

            640

        ]

    );



    /*
        執行模型
    */

    let output =
    await session.run({

        [session.inputNames[0]]:
        tensor

    });



    /*
        回傳 AI 結果

        同時保留縮放資訊
        用來將座標轉回原始照片
    */

    return {

        output:
        output.output0,

        scale,

        padX,

        padY

    };

}



/* =======================
   處理辨識結果
======================= */

function drawResult(r){


    let data =
    r.output.data;



    /*
        YOLO 輸出數量

        你的原始程式設定為 8400
    */

    let total =
    8400;



    let points = [];



    /*
        找出信心度大於 0.65 的結果
    */

    for(
        let i = 0;
        i < total;
        i++
    ){


        let score =
        data[i + total * 4];



        /*
            信心度低於 0.65
            不採用
        */

        if(score < 0.65){

            continue;

        }



        /*
            將座標轉回原始圖片
        */

        points.push({

            x:
            (data[i] - r.padX)
            / r.scale,


            y:
            (data[i + total] - r.padY)
            / r.scale,


            w:
            data[i + total * 2]
            / r.scale,


            h:
            data[i + total * 3]
            / r.scale,


            score

        });

    }



    /*
        NMS

        移除重複辨識
    */

    points =
    nms(

        points,

        0.35

    );



    /*
        =================================
        非常重要
        =================================

        把 AI 辨識結果儲存起來。

        之後使用者切換紅/綠/黃時，
        不需要再次執行 AI。
    */

    detectedPoints =
    points;



    /*
        畫出標記
    */

    drawPoints();



    /*
        顯示藥品數量
    */

    document.getElementById("count")
    .innerHTML =

    "藥品數量:"
    +
    points.length
    +
    " 顆";

}



/* =======================
   畫標記
======================= */

function drawPoints(){


    /*
        先重新繪製原本的照片

        避免切換顏色時
        舊顏色殘留
    */

    /*
        注意：

        Canvas 裡目前已經包含照片，
        但之前畫過標記。

        因此需要重新從 video / 原圖
        建立乾淨畫面。

        因為拍照後 video 仍然存在，
        所以如果 locked 狀態下直接從 video
        重畫，畫面可能仍是即時影像。

        因此這裡使用另外一個 offscreen canvas
        儲存乾淨照片。
    */

    if(!window.originalPhoto){

        return;

    }



    /*
        將原始照片重新畫回 Canvas
    */

    ctx.clearRect(

        0,

        0,

        canvas.width,

        canvas.height

    );


    ctx.drawImage(

        window.originalPhoto,

        0,

        0

    );



    /*
        使用目前選擇的顏色
        畫出所有藥品標記
    */

    detectedPoints.forEach(p=>{


        ctx.beginPath();


        ctx.arc(

            p.x,

            p.y,

            6,

            0,

            Math.PI * 2

        );


        /*
            所有標記共用同一個顏色
        */

        ctx.fillStyle =
        selectedColor;


        ctx.fill();


    });

}



/* =======================
   NMS
======================= */

function nms(boxes, t){


    /*
        按照信心度
        從高到低排序
    */

    boxes.sort(

        (a,b)=>
        b.score - a.score

    );


    let result = [];



    while(boxes.length){


        /*
            取最高信心度
        */

        let best =
        boxes.shift();



        result.push(best);



        /*
            移除與 best
            重疊太高的框
        */

        boxes =
        boxes.filter(

            b =>
            iou(best,b) < t

        );

    }



    return result;

}



/* =======================
   IOU
======================= */

function iou(a,b){


    /*
        A 左上
    */

    let ax1 =
    a.x - a.w / 2;


    let ay1 =
    a.y - a.h / 2;



    /*
        A 右下
    */

    let ax2 =
    a.x + a.w / 2;


    let ay2 =
    a.y + a.h / 2;



    /*
        B 左上
    */

    let bx1 =
    b.x - b.w / 2;


    let by1 =
    b.y - b.h / 2;



    /*
        B 右下
    */

    let bx2 =
    b.x + b.w / 2;


    let by2 =
    b.y + b.h / 2;



    /*
        計算交集寬度
    */

    let iw =
    Math.max(

        0,

        Math.min(ax2,bx2)
        -
        Math.max(ax1,bx1)

    );



    /*
        計算交集高度
    */

    let ih =
    Math.max(

        0,

        Math.min(ay2,by2)
        -
        Math.max(ay1,by1)

    );



    /*
        交集面積
    */

    let inter =
    iw * ih;



    /*
        IOU
    */

    return inter /

    (

        a.w * a.h
        +
        b.w * b.h
        -
        inter

    );

}


</script>


</body>

</html>
